name: Publicar no NPM

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # 1. Fazer checkout do código
      - name: Fazer Checkout do Código
        uses: actions/checkout@v3

      # 2. Configurar Node.js e o registro do npm
      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      # 3. Validar se o token NPM_TOKEN foi configurado
      - name: Validar Configuração do Ambiente
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "Erro: O segredo NPM_TOKEN não está configurado!" >&2
            exit 1
          fi
          echo "Token NPM_TOKEN configurado com sucesso."
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 4. Instalar dependências
      - name: Instalar Dependências
        run: npm install

      # 5. Validar versão do pacote
      - name: Validar Versões
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm view $(node -p "require('./package.json').name") version || echo "0.0.0")
          if [[ "$(printf '%s\n' "$PACKAGE_VERSION" "$NPM_VERSION" | sort -V | tail -n1)" != "$PACKAGE_VERSION" ]]; then
            echo "Erro: A versão do package.json ($PACKAGE_VERSION) não é maior que a versão publicada no NPM ($NPM_VERSION)." >&2
            exit 1
          fi
          echo "Versão validada. Pronta para publicação."

      # 6. Build do projeto (caso necessário)
      - name: Buildar Projeto
        run: npm run build

      # 7. Publicar no npm
      - name: Publicar Pacote no NPM
        run: npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
