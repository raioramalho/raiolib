name: Publicar no NPM

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    environment: NPM_TOKEN
    steps:
      - name: Fazer Checkout do Código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Logar no NPM com Adduser
        run: |
          echo "//registry.npmjs.org/:username=${{ secrets.NPM_USERNAME }}" > ~/.npmrc
          echo "//registry.npmjs.org/:_password=$(echo -n ${{ secrets.NPM_PASSWORD }} | base64)" >> ~/.npmrc
          echo "//registry.npmjs.org/:email=${{ secrets.NPM_EMAIL }}" >> ~/.npmrc
          npm adduser
        env:
          NPM_USERNAME: ${{ secrets.NPM_USERNAME }}
          NPM_PASSWORD: ${{ secrets.NPM_PASSWORD }}
          NPM_EMAIL: ${{ secrets.NPM_EMAIL }}

      - name: Validar Configuração do Ambiente
        run: |
          if [ -z "${{ secrets.NODE_AUTH_TOKEN }}" ]; then
            echo "Erro: O segredo NODE_AUTH_TOKEN não está configurado!" >&2
            exit 1
          fi
          echo "Todos os segredos necessários estão configurados."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Validar Login no NPM
        run: |
          npm whoami || (echo "Erro: Não foi possível autenticar no NPM. Verifique o token de autenticação." >&2 && exit 1)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Verificar Dependências
        run: |
          if ! npm install; then
            echo "Erro: As dependências não puderam ser instaladas. Verifique o arquivo package.json." >&2
            exit 1
          fi
          echo "Dependências instaladas com sucesso."

      - name: Validar Versões
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm view . version || echo "0.0.0")
          if [[ "$(printf '%s\n' "$PACKAGE_VERSION" "$NPM_VERSION" | sort -V | tail -n1)" != "$PACKAGE_VERSION" ]]; then
            echo "Erro: A versão do package.json ($PACKAGE_VERSION) não é maior que a versão publicada no NPM ($NPM_VERS
