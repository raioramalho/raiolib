name: Publicar no NPM

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fazer Checkout do Código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Validar Configuração do Ambiente
        run: |
          if [ -z "${{ secrets.NODE_AUTH_TOKEN }}" ]; then
            echo "Erro: O segredo NODE_AUTH_TOKEN não está configurado!" >&2
            exit 1
          fi
          if [ -z "${{ secrets.NPM_USERNAME }}" ] || [ -z "${{ secrets.NPM_PASSWORD }}" ] || [ -z "${{ secrets.NPM_EMAIL }}" ]; then
            echo "Erro: Um ou mais segredos do NPM (USERNAME, PASSWORD, EMAIL) estão ausentes!" >&2
            exit 1
          fi
          echo "Todos os segredos necessários estão configurados."

      - name: Validar Login no NPM
        run: |
          npm whoami || (echo "Erro: Não foi possível autenticar no NPM. Verifique o token de autenticação." >&2 && exit 1)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Verificar Dependências
        run: |
          if ! npm install; then
            echo "Erro: As dependências não puderam ser instaladas. Verifique o arquivo package.json." >&2
            exit 1
          fi
          echo "Dependências instaladas com sucesso."

      - name: Validar Versões
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm view . version || echo "0.0.0")
          if [[ "$(printf '%s\n' "$PACKAGE_VERSION" "$NPM_VERSION" | sort -V | tail -n1)" != "$PACKAGE_VERSION" ]]; then
            echo "Erro: A versão do package.json ($PACKAGE_VERSION) não é maior que a versão publicada no NPM ($NPM_VERSION)." >&2
            exit 1
          fi
          echo "Versão validada. Pronta para publicação."

      - name: Buildar Projeto
        run: npm run build

      - name: Publicar Pacote no NPM
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
